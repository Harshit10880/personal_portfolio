<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Harsit Chavda — Certifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,400;1,600;1,800&family=Cormorant+Garamond:ital,wght@1,300;1,400;1,500;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#050a18;--deep:#080d1f;--card-bg:#070c1c;
  --accent:#7c6fff;--blue:#60a5fa;--pink:#c084fc;
  --white:#f0eeff;--off-white:#eaeaea;--muted:rgba(200,195,240,0.48);--gray:#a0a0b8;
  --grain-op:0.032;
}
html{scroll-behavior:smooth}
html,body{background:var(--navy);color:var(--white);font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden;cursor:none}
::-webkit-scrollbar{display:none}
body{-ms-overflow-style:none;scrollbar-width:none}

/* GRAIN */
#grain{position:fixed;inset:0;pointer-events:none;z-index:300;opacity:var(--grain-op);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px;animation:grain .5s steps(1) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-5%,3%)}40%{transform:translate(3%,-4%)}60%{transform:translate(-3%,5%)}80%{transform:translate(4%,-2%)}100%{transform:translate(0,0)}}

/* CURSOR */
#cursor-orb{position:fixed;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--accent) 60%,transparent 100%);box-shadow:0 0 10px 4px rgba(124,111,255,.6),0 0 24px 8px rgba(124,111,255,.2);pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .2s,height .2s,box-shadow .2s}
#cursor-trail{position:fixed;width:28px;height:28px;border-radius:50%;border:1px solid rgba(124,111,255,.3);background:rgba(124,111,255,.04);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .25s,height .25s,opacity .4s}

/* BLOBS */
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.08;pointer-events:none;z-index:0}
.blob-1{width:500px;height:500px;background:#2d2070;top:-120px;left:-80px;animation:bd 22s ease-in-out infinite alternate}
.blob-2{width:300px;height:300px;background:#5e2baa;bottom:-60px;right:-60px;animation:bd 28s ease-in-out infinite alternate-reverse}
.blob-3{width:220px;height:220px;background:#1a1560;top:45%;left:55%;animation:bd 18s ease-in-out infinite alternate}
@keyframes bd{from{transform:translate(0,0) scale(1)}to{transform:translate(26px,18px) scale(1.07)}}

/* NAVBAR */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(24px,6vw,72px);height:68px;background:rgba(5,10,24,.55);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid rgba(124,111,255,.08);transition:background .4s,box-shadow .4s,border-color .4s}
nav.scrolled{background:rgba(5,10,24,.92);box-shadow:0 8px 40px rgba(0,0,0,.45);border-color:rgba(124,111,255,.15)}
.nav-logo{font-family:'ClashDisplay','Clash Display',sans-serif;font-weight:600;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;color:var(--white);text-decoration:none;position:relative}
.nav-logo::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--accent),transparent);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.nav-logo:hover::after{transform:scaleX(1)}
.nav-links{display:flex;gap:clamp(20px,3vw,40px);list-style:none}
.nav-links a{font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;position:relative;transition:color .25s}
.nav-links a.active,.nav-links a:hover{color:var(--white)}
.nav-links a::after{content:'';position:absolute;bottom:-3px;left:0;right:0;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.nav-links a.active::after,.nav-links a:hover::after{transform:scaleX(1)}
.hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px}
.hamburger span{display:block;width:22px;height:1.5px;background:var(--white);border-radius:2px;transition:transform .3s,opacity .3s}
.hamburger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
.mobile-menu{display:none;position:fixed;top:68px;left:0;right:0;background:rgba(5,10,24,.97);backdrop-filter:blur(20px);padding:24px clamp(24px,6vw,72px);flex-direction:column;gap:20px;border-bottom:1px solid rgba(124,111,255,.1);z-index:99;opacity:0;transform:translateY(-8px);transition:transform .35s,opacity .35s}
.mobile-menu.open{display:flex;opacity:1;transform:translateY(0)}
.mobile-menu a{font-family:'Outfit',sans-serif;font-size:1rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
.mobile-menu a:hover{color:var(--white)}

/* PAGE */
.page{position:relative;z-index:10;padding-top:68px}

/* SECTION */
.certs-section{max-width:1200px;margin:0 auto;padding:clamp(60px,10vh,110px) clamp(20px,5vw,60px)}

/* Section heading */
.section-head{text-align:center;margin-bottom:clamp(48px,8vh,80px);opacity:0;animation:rise .9s .1s ease forwards}
.section-label{font-family:'Outfit',sans-serif;font-size:.72rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:12px}
.section-title{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(2.4rem,5vw,4rem);line-height:1;letter-spacing:-.02em;color:var(--white)}
.section-title .italic-word{font-style:italic;font-weight:600;background:linear-gradient(120deg,#d4cfff 0%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.section-subtitle{margin-top:12px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1rem,1.8vw,1.25rem);color:var(--gray)}
.divider{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:18px auto 0;opacity:.6}

/* ══════════════════════════════════
   CAROUSEL
══════════════════════════════════ */
.carousel-shell{position:relative;padding:16px 0 36px}

/* Nav arrows */
.c-arrow{
  position:absolute;top:50%;transform:translateY(-60%);z-index:20;
  width:46px;height:46px;border-radius:50%;
  background:rgba(10,14,32,.7);border:1px solid rgba(124,111,255,.3);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .25s,border-color .25s,box-shadow .25s,transform .25s;
}
.c-arrow:hover{background:rgba(124,111,255,.18);border-color:rgba(124,111,255,.6);box-shadow:0 0 18px rgba(124,111,255,.38);transform:translateY(-60%) scale(1.08)}
.c-arrow svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.c-arrow-prev{left:0}
.c-arrow-next{right:0}

/* Viewport clips the track */
.c-viewport{overflow:hidden;padding:40px 0;margin:0 clamp(44px,7vw,76px)}

/* Sliding track */
.c-track{display:flex;align-items:center;gap:clamp(16px,2.8vw,32px);transition:transform .58s cubic-bezier(.4,0,.2,1);will-change:transform}

/* ── CERT CARD ── */
.c-card{
  flex:0 0 clamp(250px,29vw,348px);
  border-radius:18px;position:relative;
  /* gradient border via wrapper bg */
  background:linear-gradient(135deg,rgba(96,165,250,.5),rgba(124,111,255,.55),rgba(192,132,252,.45));
  padding:1.5px;
  cursor:pointer;
  /* default side state */
  transform:scale(0.87);opacity:.48;filter:blur(.6px);
  transition:transform .52s cubic-bezier(.4,0,.2,1),opacity .52s ease,box-shadow .52s ease,filter .52s ease;
}
.c-card.is-active{
  transform:scale(1.07);opacity:1;filter:none;
  box-shadow:0 0 44px rgba(124,111,255,.3),0 0 90px rgba(124,111,255,.12),0 10px 36px rgba(0,0,0,.55);
}
.c-card.is-adj{transform:scale(0.94);opacity:.72;filter:none}

.c-inner{background:var(--card-bg);border-radius:17px;overflow:hidden;display:flex;flex-direction:column}

/* image zone */
.c-img{width:100%;aspect-ratio:4/2.75;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.c-img::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,var(--card-bg) 100%);pointer-events:none}
.c-img svg{transition:transform .5s ease}
.c-card.is-active .c-img svg{transform:scale(1.03)}

/* info */
.c-info{padding:14px 18px 20px;display:flex;flex-direction:column;gap:4px}
.c-name{font-family:'Playfair Display',serif;font-weight:800;font-size:.97rem;line-height:1.28;color:var(--white);letter-spacing:-.01em}
.c-name .ip{font-style:italic;font-weight:600}
.c-issuer{font-family:'Outfit',sans-serif;font-size:.75rem;font-weight:400;color:var(--accent);margin-top:1px}
.c-date{font-family:'Outfit',sans-serif;font-size:.68rem;font-weight:300;color:var(--gray)}

/* Dots */
.c-dots{display:flex;justify-content:center;gap:8px;margin-top:22px}
.c-dot{width:6px;height:6px;border-radius:50%;background:rgba(124,111,255,.25);cursor:pointer;transition:background .3s,width .3s,border-radius .3s}
.c-dot.on{width:24px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--accent))}

/* Progress strip */
.c-progress{width:clamp(100px,18vw,180px);height:2px;background:rgba(124,111,255,.14);border-radius:2px;margin:14px auto 0;overflow:hidden}
.c-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--accent),var(--pink));border-radius:2px;transition:width .42s ease}

/* ══════════════════════════════════
   MODAL
══════════════════════════════════ */
.m-overlay{position:fixed;inset:0;z-index:600;background:rgba(2,4,14,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .38s ease,visibility .38s ease}
.m-overlay.open{opacity:1;visibility:visible}
.m-box{position:relative;max-width:780px;width:100%;background:var(--card-bg);border-radius:20px;border:1px solid rgba(124,111,255,.2);box-shadow:0 0 70px rgba(124,111,255,.22),0 24px 70px rgba(0,0,0,.75);overflow:hidden;transform:scale(.86) translateY(16px);transition:transform .44s cubic-bezier(.34,1.56,.64,1)}
.m-overlay.open .m-box{transform:scale(1) translateY(0)}
.m-img{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden}
.m-info{padding:22px 28px 26px;display:flex;flex-direction:column;gap:5px}
.m-name{font-family:'Playfair Display',serif;font-weight:800;font-size:1.32rem;color:var(--white);letter-spacing:-.01em}
.m-name .ip{font-style:italic;font-weight:600}
.m-issuer{font-family:'Outfit',sans-serif;font-size:.88rem;color:var(--accent)}
.m-date{font-family:'Outfit',sans-serif;font-size:.76rem;color:var(--gray)}
.m-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(124,111,255,.1);border:1px solid rgba(124,111,255,.28);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;transition:background .22s,box-shadow .22s,transform .22s}
.m-close:hover{background:rgba(124,111,255,.24);box-shadow:0 0 14px rgba(124,111,255,.32);transform:scale(1.08) rotate(90deg)}
.m-close svg{width:14px;height:14px;stroke:var(--white);fill:none;stroke-width:2.5;stroke-linecap:round}

/* ══════════════════════════════════
   CTA + QR
══════════════════════════════════ */
.cta-block{display:flex;flex-direction:column;align-items:center;gap:26px;margin-top:clamp(48px,7vh,76px);opacity:0;animation:rise .9s .5s ease forwards}
.cta-row{display:flex;align-items:center;gap:clamp(20px,4vw,44px);flex-wrap:wrap;justify-content:center}

.view-btn{
  display:inline-flex;align-items:center;gap:9px;
  font-family:'Outfit',sans-serif;font-size:.88rem;font-weight:500;letter-spacing:.04em;
  text-decoration:none;padding:14px 32px;border-radius:100px;
  background:linear-gradient(135deg,var(--blue),var(--accent),var(--pink));
  background-size:220% 220%;background-position:0% 50%;
  color:#fff;transition:background-position .55s,box-shadow .35s,transform .25s;
  position:relative;overflow:hidden;
}
.view-btn::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:background .25s;border-radius:inherit}
.view-btn:hover{background-position:100% 50%;box-shadow:0 8px 32px rgba(124,111,255,.5),0 0 0 1px rgba(124,111,255,.4);transform:translateY(-2px) scale(1.02)}
.view-btn:hover::before{background:rgba(255,255,255,.06)}
.view-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;transition:transform .2s}
.view-btn:hover svg{transform:translateX(3px)}

/* QR */
.qr-block{display:flex;flex-direction:column;align-items:center;gap:9px}
.qr-frame{width:92px;height:92px;border-radius:12px;background:rgba(7,12,28,.9);border:1px solid rgba(124,111,255,.22);padding:8px;box-shadow:0 0 18px rgba(124,111,255,.1);display:flex;align-items:center;justify-content:center}
.qr-label{font-family:'Outfit',sans-serif;font-size:.67rem;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);text-align:center;max-width:100px;line-height:1.55}

/* Reveal + keyframes */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .75s ease,transform .75s ease}
.reveal.visible{opacity:1;transform:none}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* RESPONSIVE */
@media(max-width:860px){.nav-links{display:none}.hamburger{display:flex}.c-card{flex:0 0 clamp(230px,52vw,310px)}}
@media(max-width:580px){
  .c-arrow{display:none}
  .c-viewport{margin:0 8px}
  .c-card{flex:0 0 86vw;transform:scale(1)!important;opacity:1!important;filter:none!important}
  .c-card.is-active{box-shadow:0 0 30px rgba(124,111,255,.28),0 6px 24px rgba(0,0,0,.5)}
  .cta-row{flex-direction:column}
}
</style>
</head>
<body>
<div id="grain"></div>
<div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
<div id="cursor-orb"></div><div id="cursor-trail"></div>

<!-- MODAL -->
<div class="m-overlay" id="modal" role="dialog" aria-modal="true">
  <div class="m-box" id="mBox">
    <button class="m-close" id="mClose" aria-label="Close">
      <svg viewBox="0 0 14 14"><line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/></svg>
    </button>
    <div class="m-img" id="mImg"></div>
    <div class="m-info">
      <div class="m-name" id="mName"></div>
      <div class="m-issuer" id="mIssuer"></div>
      <div class="m-date" id="mDate"></div>
    </div>
  </div>
</div>

<!-- NAVBAR -->
<nav id="navbar">
  <a href="#" class="nav-logo">Harsit Chavda</a>
  <ul class="nav-links">
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Journey</a></li>
    <li><a href="#">Projects</a></li>
    <li><a href="#certs" class="active">Certifications</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
  <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="mobile-menu" id="mmenu">
  <a href="#">Home</a><a href="#">About</a><a href="#">Journey</a>
  <a href="#">Projects</a><a href="#certs">Certifications</a><a href="#">Contact</a>
</div>

<!-- PAGE -->
<div class="page">
<section class="certs-section" id="certs">

  <div class="section-head">
    <span class="section-label">Credentials</span>
    <h2 class="section-title">My <span class="italic-word">Certifications</span></h2>
    <p class="section-subtitle">Proof of continuous learning and growth</p>
    <div class="divider"></div>
  </div>

  <!-- CAROUSEL -->
  <div class="carousel-shell">
    <button class="c-arrow c-arrow-prev" id="aPrev" aria-label="Previous">
      <svg viewBox="0 0 20 20"><polyline points="13 4 7 10 13 16"/></svg>
    </button>
    <div class="c-viewport" id="cVP">
      <div class="c-track" id="cTrack"></div>
    </div>
    <button class="c-arrow c-arrow-next" id="aNext" aria-label="Next">
      <svg viewBox="0 0 20 20"><polyline points="7 4 13 10 7 16"/></svg>
    </button>
    <div class="c-dots" id="cDots"></div>
    <div class="c-progress"><div class="c-fill" id="cFill"></div></div>
  </div>

  <!-- CTA + QR -->
  <div class="cta-block reveal">
    <div class="cta-row">

      <a href="https://drive.google.com" target="_blank" rel="noopener" class="view-btn">
        View More Certifications
        <svg viewBox="0 0 14 14"><path d="M1 7h12M7 1l6 6-6 6"/></svg>
      </a>

      <div class="qr-block">
        <div class="qr-frame">
          <svg width="76" height="76" viewBox="0 0 76 76" fill="none">
            <!-- Finder TL -->
            <rect x="2" y="2" width="24" height="24" rx="3.5" stroke="rgba(124,111,255,.65)" stroke-width="2" fill="none"/>
            <rect x="7" y="7" width="14" height="14" rx="2" fill="rgba(124,111,255,.5)"/>
            <!-- Finder TR -->
            <rect x="50" y="2" width="24" height="24" rx="3.5" stroke="rgba(124,111,255,.65)" stroke-width="2" fill="none"/>
            <rect x="55" y="7" width="14" height="14" rx="2" fill="rgba(124,111,255,.5)"/>
            <!-- Finder BL -->
            <rect x="2" y="50" width="24" height="24" rx="3.5" stroke="rgba(124,111,255,.65)" stroke-width="2" fill="none"/>
            <rect x="7" y="55" width="14" height="14" rx="2" fill="rgba(124,111,255,.5)"/>
            <!-- Data modules -->
            <rect x="32" y="2" width="6" height="6" rx="1" fill="rgba(96,165,250,.55)"/>
            <rect x="40" y="2" width="6" height="6" rx="1" fill="rgba(192,132,252,.5)"/>
            <rect x="32" y="10" width="6" height="6" rx="1" fill="rgba(124,111,255,.48)"/>
            <rect x="40" y="10" width="6" height="6" rx="1" fill="rgba(96,165,250,.42)"/>
            <rect x="32" y="18" width="6" height="6" rx="1" fill="rgba(192,132,252,.45)"/>
            <rect x="2" y="32" width="6" height="6" rx="1" fill="rgba(96,165,250,.5)"/>
            <rect x="10" y="32" width="6" height="6" rx="1" fill="rgba(124,111,255,.45)"/>
            <rect x="18" y="32" width="6" height="6" rx="1" fill="rgba(192,132,252,.42)"/>
            <rect x="2" y="40" width="6" height="6" rx="1" fill="rgba(192,132,252,.45)"/>
            <rect x="10" y="40" width="6" height="6" rx="1" fill="rgba(96,165,250,.4)"/>
            <!-- Centre pattern -->
            <rect x="32" y="32" width="12" height="12" rx="2" fill="rgba(124,111,255,.3)" stroke="rgba(124,111,255,.5)" stroke-width="1"/>
            <rect x="46" y="32" width="6" height="6" rx="1" fill="rgba(96,165,250,.5)"/>
            <rect x="54" y="32" width="6" height="6" rx="1" fill="rgba(192,132,252,.45)"/>
            <rect x="62" y="32" width="6" height="6" rx="1" fill="rgba(124,111,255,.42)"/>
            <rect x="46" y="40" width="6" height="6" rx="1" fill="rgba(124,111,255,.45)"/>
            <rect x="62" y="40" width="6" height="6" rx="1" fill="rgba(96,165,250,.4)"/>
            <rect x="32" y="46" width="6" height="6" rx="1" fill="rgba(192,132,252,.5)"/>
            <rect x="40" y="46" width="6" height="6" rx="1" fill="rgba(96,165,250,.45)"/>
            <rect x="54" y="46" width="6" height="6" rx="1" fill="rgba(192,132,252,.45)"/>
            <rect x="62" y="54" width="6" height="6" rx="1" fill="rgba(96,165,250,.4)"/>
            <rect x="32" y="54" width="6" height="6" rx="1" fill="rgba(124,111,255,.45)"/>
            <rect x="40" y="62" width="6" height="6" rx="1" fill="rgba(192,132,252,.42)"/>

/* ═══════════════════════ BUILD ═══════════════════════ */
const track  = document.getElementById('cTrack');
const dotsW  = document.getElementById('cDots');
const fill   = document.getElementById('cFill');
const vp     = document.getElementById('cVP');
const N      = CERTS.length;
let cur=0, autoT=null, paused=false;

CERTS.forEach((c,i)=>{
  /* Card */
  const card=document.createElement('div');
  card.className='c-card';
  card.dataset.i=i;
  card.innerHTML=`<div class="c-inner">
    <div class="c-img" style="background:linear-gradient(135deg,${c.bg[0]} 0%,${c.bg[1]} 100%)">${c.svg}</div>
    <div class="c-info">
      <div class="c-name">${c.name}</div>
      <div class="c-issuer">${c.issuer}</div>
      <div class="c-date">${c.date}</div>
    </div>
  </div>`;
  card.addEventListener('click',()=>openModal(i));
  track.appendChild(card);
  /* Dot */
  const dot=document.createElement('div');
  dot.className='c-dot';
  dot.addEventListener('click',()=>{goTo(i);resetAuto()});
  dotsW.appendChild(dot);
});

const cards=[...track.querySelectorAll('.c-card')];
const dots=[...dotsW.querySelectorAll('.c-dot')];

function cardW(){
  if(!cards[0])return 300;
  return cards[0].offsetWidth+parseInt(getComputedStyle(track).gap||0);
}
function update(){
  const vpW=vp.offsetWidth;
  const cw=cards[0].offsetWidth;
  const gap=parseInt(getComputedStyle(track).gap||0);
  const offset=(vpW/2)-(cw/2)-(cur*(cw+gap));
  track.style.transform=`translateX(${offset}px)`;
  cards.forEach((c,i)=>{
    c.classList.remove('is-active','is-adj');
    if(i===cur)c.classList.add('is-active');
    else if(i===cur-1||i===cur+1)c.classList.add('is-adj');
  });
  dots.forEach((d,i)=>d.classList.toggle('on',i===cur));
  fill.style.width=((cur/(N-1))*100)+'%';
}
function goTo(i){cur=((i%N)+N)%N;update()}
function next(){goTo(cur+1)}
function prev(){goTo(cur-1)}

document.getElementById('aNext').addEventListener('click',()=>{next();resetAuto()});
document.getElementById('aPrev').addEventListener('click',()=>{prev();resetAuto()});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){next();resetAuto()}
  if(e.key==='ArrowLeft') {prev();resetAuto()}
  if(e.key==='Escape')closeModal();
});

function startAuto(){autoT=setInterval(()=>{if(!paused&&!document.getElementById('modal').classList.contains('open'))next()},3900)}
function resetAuto(){clearInterval(autoT);startAuto()}
vp.addEventListener('mouseenter',()=>paused=true);
vp.addEventListener('mouseleave',()=>paused=false);

/* Swipe */
let tx0=0;
vp.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX},{passive:true});
vp.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx0;
  if(Math.abs(dx)>42){dx<0?next():prev();resetAuto()}
},{passive:true});

update();startAuto();
window.addEventListener('resize',update);

/* ═══════════════════════ MODAL ═══════════════════════ */
const modal=document.getElementById('modal');
function openModal(i){
  const c=CERTS[i];
  document.getElementById('mImg').innerHTML=c.svg;
  document.getElementById('mImg').style.background=`linear-gradient(135deg,${c.bg[0]} 0%,${c.bg[1]} 100%)`;
  document.getElementById('mName').innerHTML=c.name;
  document.getElementById('mIssuer').textContent=c.issuer;
  document.getElementById('mDate').textContent=c.date;
  modal.classList.add('open');document.body.style.overflow='hidden';
}
function closeModal(){modal.classList.remove('open');document.body.style.overflow=''}
document.getElementById('mClose').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});

/* ═══════════════════════ CURSOR ═══════════════════════ */
const orb=document.getElementById('cursor-orb'),trail=document.getElementById('cursor-trail');
let ox=0,oy=0,trx=0,try_=0,lm=0;
document.addEventListener('mousemove',e=>{ox=e.clientX;oy=e.clientY;lm=Date.now()});
document.querySelectorAll('a,button,.c-card').forEach(el=>{
  el.addEventListener('mouseenter',()=>{orb.style.width=orb.style.height='18px';orb.style.boxShadow='0 0 14px 6px rgba(124,111,255,.8),0 0 36px 12px rgba(124,111,255,.25)';trail.style.width=trail.style.height='44px'});
  el.addEventListener('mouseleave',()=>{orb.style.width=orb.style.height=orb.style.boxShadow='';trail.style.width=trail.style.height=''});
});
function lerp(a,b,t){return a+(b-a)*t}
(function tick(){
  orb.style.left=ox+'px';orb.style.top=oy+'px';
  trx=lerp(trx,ox,.1);try_=lerp(try_,oy,.1);
  trail.style.left=trx+'px';trail.style.top=try_+'px';
  trail.style.opacity=Date.now()-lm>800?'0':'1';
  requestAnimationFrame(tick);
})();

/* NAVBAR */
const nav=document.getElementById('navbar');
window.addEventListener('scroll',()=>nav.classList.toggle('scrolled',scrollY>30),{passive:true});

/* HAMBURGER */
const ham=document.getElementById('hamburger'),mm=document.getElementById('mmenu');
ham.addEventListener('click',()=>{const o=ham.classList.toggle('open');mm.classList.toggle('open',o)});
mm.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{ham.classList.remove('open');mm.classList.remove('open')}));

/* SCROLL REVEAL */
const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}})},{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
const hobs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.style.animationPlayState='running';hobs.unobserve(e.target)}})},{threshold:.1});
document.querySelectorAll('.section-head').forEach(el=>{el.style.animationPlayState='paused';hobs.observe(el)});
